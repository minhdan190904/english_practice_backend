spring.application.name=english_practice_backend

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/english_practice?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Firebase Configuration
firebase.config.path=${FIREBASE_CONFIG_PATH}

# Google Cloud Vertex AI Configuration
gcp.config.path=${GCP_CONFIG_PATH}
gcp.project-id=${GCP_PROJECT_ID}
gcp.location=${GCP_LOCATION:us-central1}

spring.mvc.favicon.enabled=false

# Telegram Bot Configuration (?ã chuy?n hoàn toàn sang nh?n t? env)
telegram.bot-token=${TELEGRAM_BOT_TOKEN}
telegram.chat-id=${TELEGRAM_CHAT_ID}