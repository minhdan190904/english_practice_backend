spring.application.name=english_practice_backend

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/english_practice?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Firebase Configuration
firebase.config.path=${FIREBASE_CONFIG_PATH}

jwt.secret-key=${JWT_SECRET_KEY}
api.client-key=${API_CLIENT_KEY}

# Google Cloud Vertex AI Configuration
gcp.config.path=${GCP_CONFIG_PATH}
gcp.project-id=${GCP_PROJECT_ID}
gcp.location=${GCP_LOCATION:us-central1}

spring.mvc.favicon.enabled=false

telegram.bot-token=${TELEGRAM_BOT_TOKEN}
telegram.chat-id=${TELEGRAM_CHAT_ID}

# Cloudflare R2
cloudflare.r2.access-key=${CLOUDFLARE_R2_ACCESS_KEY}
cloudflare.r2.secret-key=${CLOUDFLARE_R2_SECRET_KEY}
cloudflare.r2.endpoint=${CLOUDFLARE_R2_ENDPOINT}
cloudflare.r2.bucket=${CLOUDFLARE_R2_BUCKET}
cloudflare.r2.public-url=${CLOUDFLARE_R2_PUBLIC_URL}